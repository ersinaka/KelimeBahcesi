<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <title>Kelime Bahçesi - Sevimli Hayvan Çiftliği</title>
    <script>
        window.addEventListener('error', function(e) {
            console.error('Window Error:', e);
            var errEl = document.getElementById('debug-error');
            if (!errEl) {
                errEl = document.createElement('div');
                errEl.id = 'debug-error';
                errEl.style = 'position:fixed;bottom:10px;left:10px;background:#fee2e2;color:#991b1b;padding:12px;border:2px solid #ef4444;border-radius:8px;font-family:monospace;font-size:13px;z-index:999999;max-width:90%;';
                document.body.appendChild(errEl);
            }
            errEl.textContent = 'Hata: ' + e.message + ' (' + (e.filename ? e.filename.split('/').pop() : '') + ':' + e.lineno + ')';
        });
    </script>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
