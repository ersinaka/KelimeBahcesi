<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#2b2d42" flood-opacity="0.12"/>
    </filter>
  </defs>


  <!-- Tail Feathers -->
  <path d="M 320 320 C 390 280 430 240 435 190 C 420 180 395 210 375 240 C 400 210 410 160 385 160 C 370 170 350 220 330 260 Z" fill="#E63946" filter="url(#shadow)"/>
  <path d="M 340 300 C 400 270 420 220 395 210 C 375 230 350 270 330 290 Z" fill="#F4A261"/>

  <!-- Two Orange Feet & Legs -->
  <!-- Left Leg -->
  <rect x="220" y="400" width="14" height="45" rx="7" fill="#FFAA00"/>
  <path d="M 205 450 L 227 440 L 235 452 M 227 440 L 245 448" stroke="#FFAA00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Leg -->
  <rect x="278" y="400" width="14" height="45" rx="7" fill="#FFAA00"/>
  <path d="M 263 450 L 285 440 L 293 452 M 285 440 L 303 448" stroke="#FFAA00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Round Plump Hen Body -->
  <ellipse cx="256" cy="335" rx="105" ry="92" fill="#FFFDF0" filter="url(#shadow)"/>

  <!-- Wings on Body -->
  <path d="M 190 320 C 190 380 260 400 295 360 C 305 340 280 295 230 290 C 195 290 190 305 190 320 Z" fill="#F6BD60" opacity="0.35"/>
  <path d="M 205 325 C 205 370 255 385 280 355 C 285 340 270 305 235 300 C 210 300 205 315 205 325 Z" fill="#F6BD60" opacity="0.45"/>

  <!-- Breast Pale Feathers -->
  <ellipse cx="225" cy="345" rx="42" ry="54" fill="#FFFFFF"/>

  <!-- Hen Head -->
  <!-- Red Comb on Crown -->
  <g filter="url(#shadow)">
    <circle cx="230" cy="120" r="22" fill="#E63946"/>
    <circle cx="256" cy="105" r="26" fill="#E63946"/>
    <circle cx="282" cy="120" r="22" fill="#E63946"/>
  </g>

  <!-- Head Circle -->
  <circle cx="256" cy="190" r="76" fill="#FFFDF0" filter="url(#shadow)"/>

  <!-- Red Wattle Hanging Under Beak -->
  <ellipse cx="256" cy="245" rx="14" ry="20" fill="#E63946"/>

  <!-- Golden Yellow Beak -->
  <path d="M 238 200 L 274 200 L 256 226 Z" fill="#FFAA00" filter="url(#shadow)"/>

  <!-- Big Cute Eyes -->
  <ellipse cx="220" cy="180" rx="13" ry="16" fill="#2B2D42"/>
  <ellipse cx="292" cy="180" rx="13" ry="16" fill="#2B2D42"/>
  <!-- Glints -->
  <circle cx="216" cy="175" r="5.5" fill="#FFFFFF"/>
  <circle cx="223" cy="186" r="2.5" fill="#FFFFFF"/>
  <circle cx="288" cy="175" r="5.5" fill="#FFFFFF"/>
  <circle cx="295" cy="186" r="2.5" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="198" cy="205" rx="14" ry="9" fill="#FF758F" opacity="0.45"/>
  <ellipse cx="314" cy="205" rx="14" ry="9" fill="#FF758F" opacity="0.45"/>
</svg>
